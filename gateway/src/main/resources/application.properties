server.port=8080
spring.application.name=limitbook-gateway

management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.metrics.tags.application=limitbook

# CORS for local Vite dev server (read-only frontend)
limitbook.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173
